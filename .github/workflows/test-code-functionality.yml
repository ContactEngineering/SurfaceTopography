name: Test code functionality

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: "0 2 * * 5"  
jobs:
  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    strategy:
      matrix:
        # 'no': core install, without mpi4py and muGrid
        # 'yes': mpi extra, with mpi4py and muGrid compiled against OpenMPI
        mpi: ['no', 'yes']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up python3 ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and extension module
        run: |
          set -x
          sudo apt-get update -qy
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            sudo apt-get install -y openmpi-bin libopenmpi-dev
            # mpi4py and muGrid must be compiled against the system's MPI
            export CC=mpicc CXX=mpicxx
            python3 -m pip install -v --no-binary mpi4py --no-binary muGrid .[mpi,test]
          else
            python3 -m pip install -v .[test]
          fi
          python3 -m pip list

      - name: Check MPI capabilities
        run: |
          source venv/bin/activate
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            python3 -c "import muGrid, sys; print('muGrid', muGrid.__version__); sys.exit(0 if muGrid.has_mpi else 'muGrid was compiled without MPI')"
            python3 -c "import NuMPI, sys; sys.exit(0 if NuMPI._has_mpi4py else 'mpi4py is missing')"
          else
            # The core install must work without MPI and muGrid
            python3 -c "import importlib.util as u, sys; sys.exit('muGrid or mpi4py is installed' if u.find_spec('muGrid') or u.find_spec('mpi4py') else 0)"
          fi

      - name: Test with pytest
        run: |
          source venv/bin/activate
          if [ "${{ matrix.mpi }}" == "yes" ]; then
            export OMPI_MCA_mpi_yield_when_idle=1
            for nbprocs in 1 4; do
              echo "=== $nbprocs MPI processes ==="
              mpirun --oversubscribe -n $nbprocs python3 -m pytest --verbose --full-trace
            done
          else
            python3 -m pytest --verbose --full-trace -s
          fi
